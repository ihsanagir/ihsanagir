<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a34">
<title>LOU Adisyon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f6f4ef; --paper:#ffffff; --line:#e8e3d8; --margin:#e9a9a2;
  --ink:#1d2421; --muted:#6f756f; --accent:#1f3a34; --accent-ink:#fff;
  --new:#fff3c4; --ok:#2e7d4f; --danger:#b3261e; --chip:#eeeae1; --tip:#b5476a;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

header{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px}
.brand{font-weight:700;font-size:20px;letter-spacing:.02em;margin-right:auto;line-height:1.1;color:var(--accent)}
.brand .wm{font-weight:300;letter-spacing:.08em;text-transform:lowercase}
.brand .wm b{font-weight:700}
.brand small{font-family:Inter,sans-serif;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:0;display:flex;align-items:center;gap:5px;margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.live{background:var(--ok)}
.btn{border:0;border-radius:10px;padding:9px 12px;background:var(--chip);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.tip{background:var(--tip);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.table-btn{font-size:16px}
.table-btn b{font-size:18px}

.search-wrap{position:relative;margin-top:10px}
.search{width:100%;border:2px solid var(--accent);border-radius:14px;padding:13px 44px 13px 14px;font:inherit;font-size:17px;background:var(--paper);color:var(--ink);outline:none}
.search::placeholder{color:var(--muted)}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:22px;color:var(--muted);width:36px;height:36px;display:none}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}

.results{position:absolute;left:16px;right:16px;top:calc(100% + 4px);background:var(--paper);border-radius:14px;box-shadow:var(--shadow);max-height:min(60vh,460px);overflow:auto;display:none;z-index:30}
.results.show{display:block}
.res{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:11px 14px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res.active,.res:hover{background:var(--chip)}
.res .n{flex:1;min-width:0}
.res .n div{font-weight:600}
.res .n small{color:var(--muted);font-size:12px}
.res .p{font-variant-numeric:tabular-nums;font-weight:600}
.info{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);color:var(--muted);display:grid;place-items:center;font:600 13px/1 Georgia,serif;font-style:italic}
.info.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.desc{margin-top:5px;font-size:13px;line-height:1.4;color:var(--ink);opacity:.8;font-weight:400}
.desc em{font-style:normal;font-weight:600;color:var(--accent);opacity:1}
.ls-desc{margin:-4px 0 10px;font-size:13.5px;line-height:1.45;color:var(--muted)}
.res .plus{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;flex:none}
.res mark{background:transparent;color:inherit;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.empty-res{padding:14px;color:var(--muted)}

.cats{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{border:0;border-radius:999px;padding:6px 11px;background:var(--chip);font-size:13px;font-weight:500;white-space:nowrap}
.cat.on{background:var(--accent);color:var(--accent-ink)}
.groups{display:flex;gap:8px;padding-top:8px}
.gbtn{flex:1;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--paper);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gbtn .chev{font-size:11px;opacity:.7;transition:transform .15s}
.gbtn.on .chev{transform:rotate(180deg)}
.cats:empty{display:none}

main{flex:1;padding:12px 16px 120px}
.pad{background:var(--paper);border-radius:6px 6px 14px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:320px}
.pad::before{content:"";position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.7}
.pad-head{display:flex;align-items:baseline;justify-content:space-between;padding:14px 14px 8px 58px;border-bottom:2px solid var(--line)}
.pad-title{font-family:Caveat,cursive;font-size:30px;font-weight:700;line-height:1}
.pad-meta{font-size:12px;color:var(--muted);text-align:right}
.lines{list-style:none;margin:0;padding:0}
.ln{display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 12px 6px 0;border-bottom:1px solid var(--line);position:relative}
.ln.new{background:var(--new)}
.ln .q{width:44px;flex:none;text-align:center;font-family:Caveat,cursive;font-size:26px;font-weight:700;line-height:1}
.ln .body{flex:1;min-width:0;padding-left:10px;border:0;background:transparent;text-align:left;padding-top:4px;padding-bottom:4px}
.ln .nm{font-weight:600}
.ln .note{font-family:Caveat,cursive;font-size:19px;color:var(--danger);line-height:1.1}
.ln .st{font-size:11px;color:var(--muted)}
.ln .st.sent{color:var(--ok)}
.ln .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:32px;height:32px;border-radius:9px;border:0;background:var(--chip);font-size:18px;font-weight:700;line-height:1}
.pad-empty{padding:40px 20px 40px 58px;color:var(--muted)}
.pad-empty .big{font-family:Caveat,cursive;font-size:26px;color:var(--ink);opacity:.7}
.pad-foot{padding:12px 14px 14px 58px;display:flex;flex-direction:column;gap:4px}
.row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.row.total{font-size:20px;font-weight:700;padding-top:6px;border-top:2px dashed var(--line);margin-top:4px}
.table-note{width:100%;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink);font-family:Caveat,cursive;font-size:21px;padding:6px 0;outline:none}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar-in{max-width:688px;margin:0 auto;display:flex;align-items:center;gap:6px}
.bar .sum{margin-right:auto;line-height:1.1;min-width:0}
.bar .sum small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sum b{font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .btn{padding:10px 11px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:flex-end;justify-content:center}
.scrim.show{display:flex}
.sheet{background:var(--paper);width:100%;max-width:720px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px;font-size:20px;font-weight:700;line-height:1.2;color:var(--accent)}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grp{margin:4px 0 14px}
.grp-t{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.tbl{border:0;border-radius:12px;background:var(--chip);padding:10px 2px;text-align:center;min-height:62px;min-width:0}
.tbl b{display:block;font-size:19px}
.tbl small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl.open{background:var(--accent);color:var(--accent-ink)}
.tbl.open small{color:inherit;opacity:.85}
.tbl.sent{background:#cfe6fb;color:#0f3b63}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.tbl.cur{outline:3px solid var(--margin);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;outline:none;min-width:0}
.input:focus{border-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.actions .btn{flex:1;justify-content:center;padding:13px}
.big-qty{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0}
.big-qty button{width:52px;height:52px;border-radius:14px;border:0;background:var(--chip);font-size:26px;font-weight:700}
.big-qty span{font-family:Caveat,cursive;font-size:44px;font-weight:700;min-width:50px;text-align:center}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick button{border:0;background:var(--chip);border-radius:999px;padding:6px 10px;font-size:13px}
.hist{list-style:none;padding:0;margin:0}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.hist small{color:var(--muted)}
.menu-list{list-style:none;padding:0;margin:0}
.menu-list h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 4px}

/* TIP */
#tipSheet .sheet{max-height:100vh;height:100%;border-radius:0;display:flex;flex-direction:column}
.tip-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:8px 0}
.tip-title{font-size:30px;font-weight:700;line-height:1.1;color:var(--accent);letter-spacing:-.01em}
.tip-brand{font-weight:300;letter-spacing:.08em;color:var(--muted);font-size:14px}
.tip-brand b{font-weight:700;color:var(--accent)}
.tip-sub{color:var(--muted);max-width:340px;margin:0}
.qr-card{background:#fff;padding:16px;border-radius:18px;box-shadow:var(--shadow);line-height:0}
.qr-card img,.qr-card canvas{display:block;width:min(66vw,300px)!important;height:min(66vw,300px)!important;image-rendering:pixelated}
.iban{white-space:nowrap;font:600 clamp(13px,4.2vw,18px)/1.3 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.04em;word-spacing:.15em}
.holder{font-weight:600}
.tip-empty{color:var(--muted);max-width:320px}
.err{color:var(--danger);font-size:13px}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#print{display:none}
@media print{
  body{background:#fff}
  .app,.scrim,.toast,.bar{display:none!important}
  #print{display:block;font:12px/1.35 "Courier New",monospace;color:#000;width:72mm;margin:0 auto}
  #print h1{font-size:16px;text-align:center;margin:0}
  #print .c{text-align:center}
  #print table{width:100%;border-collapse:collapse}
  #print td{vertical-align:top;padding:1px 0}
  #print td.r{text-align:right;white-space:nowrap}
  #print hr{border:0;border-top:1px dashed #000}
}
@media (max-width:420px){
  .ln .stepper button{width:30px;height:30px}
  .bar .btn{padding:10px 9px;font-size:14px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div class="brand"><span class="wm"><b>lou</b>maidan</span><small><span class="dot" id="liveDot"></span><span id="liveTxt">Bağlanıyor…</span></small></div>
      <button class="btn table-btn" id="tableBtn" aria-label="Masa seç">🍽 <b id="tableName">Masa seç</b></button>
      <button class="btn ghost" id="moreBtn" aria-label="Menü">☰</button>
    </div>
    <div class="search-wrap">
      <input id="q" class="search" type="text" autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="Ürün yaz…" enterkeyhint="done" aria-label="Ürün ara ve ekle">
      <button class="clear" id="clearQ" aria-label="Temizle">×</button>
    </div>
    <div class="groups" id="groups"><button class="gbtn" data-g="food">Yiyecekler <span class="chev">▼</span></button><button class="gbtn" data-g="drink">İçecekler <span class="chev">▼</span></button></div>
    <div class="cats" id="cats"></div>
    <div class="results" id="results" role="listbox"></div>
  </header>

  <main>
    <section class="pad" id="pad"></section>
  </main>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="sum"><small id="barInfo">Toplam</small><b id="barTotal">0 ₺</b></div>
    <button class="btn" id="sendBtn">🔔 Mutfak</button>
    <button class="btn primary" id="payBtn">💳 Hesap</button>
    <button class="btn tip" id="tipBtn">TIP</button>
  </div>
</div>

<!-- Masa seçimi -->
<div class="scrim" id="tablesSheet"><div class="sheet">
  <div class="sheet-top"><h2>Masalar</h2><button class="btn ghost" data-close>Kapat</button></div>
  <div class="field" style="margin-top:0"><label>Özel masa / isim aç</label>
    <div style="display:flex;gap:8px"><input class="input" id="newTable" style="flex:1" placeholder="Masa adı"><button class="btn primary" id="addTable">Aç</button></div>
  </div>
  <div class="legend"><span><i style="background:var(--chip)"></i>Boş</span><span><i style="background:var(--accent)"></i>Sipariş alındı</span><span><i style="background:#cfe6fb;border:1px solid #9cc7ee"></i>Mutfağa gitti</span></div>
  <div id="tableGroups"></div>
</div></div>

<!-- Satır düzenle -->
<div class="scrim" id="lineSheet"><div class="sheet">
  <div class="sheet-top"><h2 id="lsName">Ürün</h2><button class="btn ghost" data-close>Kapat</button></div>
  <p class="ls-desc" id="lsDesc"></p>
  <div class="big-qty"><button id="lsMinus">−</button><span id="lsQty">1</span><button id="lsPlus">+</button></div>
  <div class="field"><label>Not (mutfağa)</label><input class="input" id="lsNote" placeholder="örn: az pişmiş, soğansız">
    <div class="quick" id="lsQuick"></div></div>
  <div class="field"><label>Birim fiyat (₺) — ikram için 0</label><input class="input" id="lsPrice" type="number" inputmode="decimal" min="0"></div>
  <div class="actions"><button class="btn danger" id="lsDelete">🗑 Sil</button><button class="btn primary" id="lsSave">Kaydet</button></div>
</div></div>

<!-- Hesap -->
<div class="scrim" id="paySheet"><div class="sheet">
  <div class="sheet-top"><h2>Hesap – <span id="payTable"></span></h2><button class="btn ghost" data-close>Kapat</button></div>
  <div class="row total" style="border-top:0;margin-top:0;padding-top:0"><span>Ödenecek</span><span id="payTotal"></span></div>
  <div class="field"><label>Kişi sayısı (bölüştür)</label>
    <div class="seg" id="splitSeg"></div>
    <div class="row" style="margin-top:6px"><span>Kişi başı</span><b id="perPerson"></b></div></div>
  <div class="field"><label>Ödeme şekli</label>
    <div class="seg" id="methodSeg"><button data-m="Kart" class="on">💳 Kart</button><button data-m="Nakit">💵 Nakit</button><button data-m="Karışık">Karışık</button></div></div>
  <div class="actions"><button class="btn tip" id="payTipBtn">TIP QR</button><button class="btn primary" id="closeBtn">✓ Ödendi, masayı kapat</button></div>
</div></div>

<!-- TIP -->
<div class="scrim" id="tipSheet"><div class="sheet">
  <div class="sheet-top"><span></span><button class="btn ghost" data-close>Kapat</button></div>
  <div class="tip-body" id="tipView"></div>
  <div id="tipEdit" style="display:none">
    <div class="field"><label>IBAN</label><input class="input" id="tipIban" placeholder="TR00 0000 0000 0000 0000 0000 00" autocomplete="off" style="font-family:ui-monospace,Menlo,monospace"></div>
    <div class="field"><label>Alıcı adı soyadı</label><input class="input" id="tipName" placeholder="Hesap sahibinin adı"></div>
    <div class="field"><label>Müşteriye mesaj (isteğe bağlı)</label><input class="input" id="tipMsg" placeholder="Teşekkür ederiz! ❤"></div>
    <div class="err" id="tipErr"></div>
    <div class="actions"><button class="btn" id="tipCancel">Vazgeç</button><button class="btn primary" id="tipSave">Kaydet</button></div>
  </div>
  <div class="actions" id="tipActions"><button class="btn" id="tipCopy">📋 IBAN'ı kopyala</button><button class="btn" id="tipEditBtn">✎ IBAN ayarla</button></div>
</div></div>

<!-- Diğer menü -->
<div class="scrim" id="moreSheet"><div class="sheet">
  <div class="sheet-top"><h2>Gün sonu</h2><button class="btn ghost" data-close>Kapat</button></div>
  <div class="row"><span>Kapanan hesap</span><b id="dayCount"></b></div>
  <div class="row"><span>Nakit</span><b id="dayCash"></b></div>
  <div class="row"><span>Kart</span><b id="dayCard"></b></div>
  <div class="row"><span>Karışık</span><b id="dayMix"></b></div>
  <div class="row total"><span>Toplam ciro</span><span id="dayTotal"></span></div>
  <h3 style="font-size:13px;color:var(--muted);margin:16px 0 0">BUGÜN KAPANAN HESAPLAR</h3>
  <ul class="hist" id="histList"></ul>
  <div class="actions">
    <button class="btn" id="browseBtn">📖 Tüm menü</button>
    <button class="btn danger" id="resetDay">Günü sıfırla</button>
  </div>
  <p class="hint">Menü fiyatları: <span id="menuDate"></span>. <span id="modeHint"></span></p>
</div></div>

<!-- Menü göz at -->
<div class="scrim" id="browseSheet"><div class="sheet">
  <div class="sheet-top"><h2>Menü</h2><button class="btn ghost" data-close>Kapat</button></div>
  <div id="browseList"></div>
</div></div>

<div class="scrim" id="askSheet" style="z-index:70"><div class="sheet">
  <h2 id="askTitle">Emin misiniz?</h2>
  <p id="askText" style="margin:0 0 6px;color:var(--muted)"></p>
  <div class="actions" id="askBtns"></div>
</div></div>

<div class="toast" id="toast"></div>
<div id="print"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="menu.js"></script>
<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const TL = n => new Intl.NumberFormat("tr-TR", {maximumFractionDigits: 2}).format(n) + " ₺";
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const hm = t => new Date(t).toLocaleTimeString("tr-TR", {hour: "2-digit", minute: "2-digit"});
  const dayKey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const uid = () => "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // ---------- Masa düzeni
  const GROUPS = [
    {title: "1. Bölüm", tables: [10, 20, 30, 11, 14, 12, 13, 21, 23, 24, 25, 31, 32, 33, 34]},
    {title: "2. Bölüm", tables: [40, 50, 60, 70, 41, 42, 43, 44, 51, 82, 54, 61, 81, 71, 80]},
    {title: "3. Bölüm · Köy", tables: [100, 103, 300, 303, 400, 403, 500]},
  ];
  const FIXED = GROUPS.flatMap(g => g.tables.map(n => "Masa " + n));

  // ---------- Türkçe duyarsız arama
  const TR = {"ç":"c","ğ":"g","ı":"i","ö":"o","ş":"s","ü":"u","â":"a","î":"i","û":"u","é":"e","'":"","’":""};
  const norm = s => s.toLocaleLowerCase("tr").replace(/[çğıöşüâîûé'’]/g, c => TR[c]).replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  const slug = name => norm(name).replace(/ /g, "-").slice(0, 80) || "t" + Math.abs([...name].reduce((a, c) => a * 31 + c.charCodeAt(0) | 0, 7));

  const ITEMS = window.MENU.map(([cat, name, price, en], i) => ({
    id: i, cat, name, price, en, desc: (window.MENU_DESC || {})[name] || "",
    nName: norm(name), hay: norm(name + " " + (en || "") + " " + cat + " " + ((window.MENU_DESC || {})[name] || "")), words: norm(name).split(" ")
  }));
  const CATS = [...new Set(ITEMS.map(i => i.cat))];
  const DRINK_CATS = ["Kokteyl", "Şarap", "Viski & Sert İçki", "Likör", "Bira", "Taze İçecek", "Soğuk İçecek", "Çay", "Kahve"];
  const GROUP_CATS = {food: CATS.filter(c => !DRINK_CATS.includes(c)), drink: CATS.filter(c => DRINK_CATS.includes(c))};
  let group = null;

  // ---------- Cihaza özel ayarlar
  const LKEY = "lou-adisyon-local";
  let L = {current: null, usage: {}};
  try { Object.assign(L, JSON.parse(localStorage.getItem(LKEY) || "{}")); } catch (e) {}
  const saveL = () => { try { localStorage.setItem(LKEY, JSON.stringify(L)); } catch (e) {} };

  // ---------- Ortak veri (db) ya da yerel yedek
  // TABLES: { slug: {name, note, opened, lines: {uid: line|null}} }
  const DEFAULT_TIP = {iban: "TR980001009010025173305004", name: "İhsan Furkan Ağır", msg: ""};
  let TABLES = {}, HISTORY = [], TIP = {...DEFAULT_TIP}, db = null, canEdit = true, readOnly = false;
  const SKEY = "lou-adisyon-shared-local";
  function loadLocalShared() {
    try { const s = JSON.parse(localStorage.getItem(SKEY) || "{}"); TABLES = s.tables || {}; HISTORY = s.history || []; TIP = s.tip || {...DEFAULT_TIP}; } catch (e) {}
  }
  const saveLocalShared = () => { try { localStorage.setItem(SKEY, JSON.stringify({tables: TABLES, history: HISTORY, tip: TIP})); } catch (e) {} };

  function onWriteErr(e) {
    if (e && (e.code === "invalid_argument" || e.code === "not_granted")) { readOnly = true; toast("Bu sayfada yazma yetkiniz yok (sadece görüntüleme)"); }
    else if (e && e.code === "quota_exceeded") toast("Kayıt alanı doldu: Gün sonundan eski günleri sıfırlayın");
    else toast("Kaydedilemedi, bağlantıyı kontrol edin");
    console.warn(e);
  }
  // Tek dokümana sırayla yaz (aynı anda tek yazma kuralı)
  const queues = {};
  function enqueue(key, fn) {
    queues[key] = (queues[key] || Promise.resolve()).then(fn).catch(onWriteErr);
    return queues[key];
  }

  const Store = {
    putTable(name) {
      const k = slug(name);
      if (TABLES[k]) return;
      TABLES[k] = {name, note: "", opened: Date.now(), lines: {}};
      this._full(k);
    },
    putLine(name, line) {
      const k = slug(name);
      if (!TABLES[k]) TABLES[k] = {name, note: "", opened: Date.now(), lines: {}};
      TABLES[k].lines = {...TABLES[k].lines, [line.uid]: line};
      if (!db) return saveLocalShared();
      const known = TABLES[k]._remote;
      enqueue("t:" + k, () => known ? db.doc("tables/" + k).update({lines: {[line.uid]: line}}) : db.doc("tables/" + k).set(clean(TABLES[k])));
    },
    delLine(name, id) {
      const k = slug(name); if (!TABLES[k]) return;
      TABLES[k].lines = {...TABLES[k].lines, [id]: null};
      if (!db) return saveLocalShared();
      enqueue("t:" + k, () => db.doc("tables/" + k).update({lines: {[id]: null}}));
    },
    markSent(name, ids, ts) {
      const k = slug(name), t = TABLES[k]; if (!t) return;
      const patch = {};
      ids.forEach(id => { t.lines[id] = {...t.lines[id], sent: ts}; patch[id] = {sent: ts}; });
      if (!db) return saveLocalShared();
      enqueue("t:" + k, () => db.doc("tables/" + k).update({lines: patch}));
    },
    setNote(name, note) {
      const k = slug(name); if (!TABLES[k]) TABLES[k] = {name, note: "", opened: Date.now(), lines: {}};
      TABLES[k].note = note;
      if (!db) return saveLocalShared();
      clearTimeout(this._nt); this._nt = setTimeout(() => {
        const known = TABLES[k] && TABLES[k]._remote;
        enqueue("t:" + k, () => known ? db.doc("tables/" + k).update({note}) : db.doc("tables/" + k).set(clean(TABLES[k])));
      }, 600);
    },
    closeTable(name, bill) {
      const k = slug(name);
      delete TABLES[k];
      if (!db) { HISTORY.unshift(bill); return saveLocalShared(); }
      HISTORY.unshift(bill);
      enqueue("h:" + bill.id, () => db.doc("history/" + bill.id).set(bill));
      enqueue("t:" + k, () => db.doc("tables/" + k).delete());
    },
    dropEmpty(name) {
      const k = slug(name), t = TABLES[k];
      if (!t || activeLines(t).length || t.note) return;
      delete TABLES[k];
      if (!db) return saveLocalShared();
      if (t._remote) enqueue("t:" + k, () => db.doc("tables/" + k).delete());
    },
    async resetDay(all) {
      const today = HISTORY.filter(h => h.day === dayKey());
      HISTORY = HISTORY.filter(h => h.day !== dayKey());
      const tables = all ? Object.keys(TABLES) : [];
      if (all) TABLES = {};
      if (!db) return saveLocalShared();
      for (const h of today) await db.doc("history/" + h.id).delete().catch(onWriteErr);
      for (const k of tables) await db.doc("tables/" + k).delete().catch(onWriteErr);
    },
    async setTip(tip) {
      TIP = tip;
      if (!db) return saveLocalShared();
      await db.doc("settings/tip").set(tip);
    },
    _full(k) {
      if (!db) return saveLocalShared();
      enqueue("t:" + k, () => db.doc("tables/" + k).set(clean(TABLES[k])));
    }
  };
  const clean = t => ({name: t.name, note: t.note || "", opened: t.opened, lines: t.lines || {}});
  const activeLines = t => Object.values(t?.lines || {}).filter(Boolean).sort((a, b) => a.at - b.at);
  const tableOf = name => name ? TABLES[slug(name)] : null;
  const total = t => activeLines(t).reduce((a, l) => a + l.qty * l.price, 0);
  const count = t => activeLines(t).reduce((a, l) => a + l.qty, 0);

  function setLive(state) {
    $("#liveDot").classList.toggle("live", state === "live");
    $("#liveTxt").textContent = state === "live" ? "Ortak · canlı" : state === "local" ? "Bu cihaz (çevrimdışı)" : state === "stale" ? "Bağlantı bekleniyor…" : "Bağlanıyor…";
    $("#modeHint").textContent = state === "local" ? "Veriler yalnızca bu cihazda saklanır." : "Masalar tüm garsonlarla anlık paylaşılır.";
  }

  async function connect() {
    setLive("connecting");
    if (!window.claude || typeof window.claude.use !== "function") { goLocal(); return; }
    db = await window.claude.use("db").catch(() => null);
    if (!db) { goLocal(); return; }
    try {
      const user = await window.claude.use("user");
      if (user) { canEdit = !!(await user.canEdit()); const w = await user.can("data.write"); if (w === false) readOnly = true; }
    } catch (e) {}
    const timer = setTimeout(() => setLive("stale"), 10000);
    db.collection("tables").onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { const v = d.data(); next[d.id] = {...v, lines: {...(v.lines || {})}, _remote: true}; });
      // henüz yazılmamış yerel masaları koru
      for (const [k, t] of Object.entries(TABLES)) if (!t._remote && !next[k]) next[k] = t;
      TABLES = next;
      if (!snap.metadata.fromCache) { clearTimeout(timer); setLive("live"); }
      renderPad(); if ($("#tablesSheet").classList.contains("show")) renderTables();
    }, e => { clearTimeout(timer); setLive("stale"); console.warn(e); });
    db.collection("history").where("day", "==", dayKey()).onSnapshot(snap => {
      HISTORY = snap.docs.map(d => d.data()).sort((a, b) => b.at - a.at);
      if ($("#moreSheet").classList.contains("show")) renderMore();
    }, e => console.warn(e));
    db.doc("settings/tip").onSnapshot(snap => {
      TIP = snap.exists && snap.data().iban ? snap.data() : {...DEFAULT_TIP};
      if ($("#tipSheet").classList.contains("show") && $("#tipEdit").style.display === "none") renderTip();
    }, e => console.warn(e));
  }
  function goLocal() { db = null; loadLocalShared(); setLive("local"); renderPad(); }

  // ---------- Arama
  function parseInput(raw) {
    let s = raw.trim(), qty = 1, note = "";
    const slash = s.indexOf("/");
    if (slash >= 0) { note = s.slice(slash + 1).trim(); s = s.slice(0, slash).trim(); }
    let m = s.match(/^(\d{1,2})\s*(?:x|adet|\*)?\s+(.+)$/i);
    if (m) { qty = +m[1]; s = m[2]; }
    else if ((m = s.match(/^(.+?)\s+(?:x|\*)?\s*(\d{1,2})$/i))) { qty = +m[2]; s = m[1]; }
    return {qty: Math.max(1, Math.min(99, qty)), term: s, note};
  }
  function search(term) {
    const q = norm(term); if (!q) return [];
    const toks = q.split(" "), out = [];
    for (const it of ITEMS) {
      let score = 0, ok = true;
      for (const t of toks) {
        if (it.hay.indexOf(t) < 0) {
          if (toks.length === 1 && t.length >= 2 && it.words.map(w => w[0]).join("").startsWith(t)) { score += 4; continue; }
          ok = false; break;
        }
        if (it.nName.startsWith(t)) score += 12;
        else if (it.words.some(w => w.startsWith(t))) score += 8;
        else if (it.nName.includes(t)) score += 4;
        else score += 1;
      }
      if (!ok) continue;
      score += Math.min(6, (L.usage[it.id] || 0) * 0.5) - it.nName.length / 100;
      out.push([score, it]);
    }
    return out.sort((a, b) => b[0] - a[0]).slice(0, 30).map(x => x[1]);
  }
  function highlight(name, term) {
    const toks = norm(term).split(" ").filter(Boolean);
    if (!toks.length) return esc(name);
    const low = name.replace(/[^\p{L}\p{N} ]/gu, " ").toLocaleLowerCase("tr").replace(/[çğıöşüâîûé]/g, c => TR[c]);
    const mark = new Array(name.length).fill(false);
    for (const t of toks) { const i = low.indexOf(t); if (i >= 0) for (let k = i; k < i + t.length; k++) mark[k] = true; }
    let html = "", open = false;
    for (let i = 0; i < name.length; i++) {
      if (mark[i] && !open) { html += "<mark>"; open = true; }
      if (!mark[i] && open) { html += "</mark>"; open = false; }
      html += esc(name[i]);
    }
    return html + (open ? "</mark>" : "");
  }

  const qEl = $("#q"), resEl = $("#results");
  let results = [], active = 0, catFilter = null, infoOpen = null;
  // İçerik: "Köfte 140 gr · a, b" → gramaj vurgulu
  const descHTML = d => { const i = d.indexOf(" · "); return i > 0 ? `<em>${esc(d.slice(0, i))}</em> · ${esc(d.slice(i + 3))}` : esc(d); };
  const infoBtn = it => it.desc ? `<span class="info${infoOpen === it.id ? " on" : ""}" data-info role="button" aria-label="İçerik">i</span>` : "";
  const descBlock = it => infoOpen === it.id && it.desc ? `<div class="desc">${descHTML(it.desc)}</div>` : "";
  function renderResults() {
    const raw = qEl.value;
    $("#clearQ").style.display = raw ? "block" : "none";
    const {qty, term, note} = parseInput(raw);
    results = catFilter && !term ? ITEMS.filter(i => i.cat === catFilter) : search(term);
    if (!raw.trim() && !catFilter) { resEl.classList.remove("show"); return; }
    active = Math.min(active, Math.max(0, results.length - 1));
    const tag = (qty > 1 ? qty + " × " : "") + (note ? " · not: " + note : "");
    resEl.innerHTML = results.length ? results.map((it, i) => `
      <button class="res${i === active ? " active" : ""}" data-id="${it.id}" role="option">
        <span class="n"><div>${highlight(it.name, term)}</div><small>${esc(it.cat)}${i === active && tag ? " — <b>" + esc(tag) + "</b>" : ""}</small>${descBlock(it)}</span>
        ${infoBtn(it)}<span class="p">${TL(it.price)}</span><span class="plus">+${qty > 1 ? qty : ""}</span>
      </button>`).join("")
      : `<div class="empty-res">“${esc(term)}” bulunamadı. Menü dışı ürün için: <b>${esc(term)} = 150</b> yazıp Enter'a bas.</div>`;
    resEl.classList.add("show");
    resEl.querySelector(".active")?.scrollIntoView({block: "nearest"});
  }

  function addItem(it, qty, note) {
    if (!L.current) { openTables(); toast("Önce bir masa seç"); return; }
    if (readOnly) { toast("Yazma yetkiniz yok"); return; }
    note = (note || "").trim();
    const t = tableOf(L.current);
    const ex = activeLines(t).find(l => l.id === it.id && !l.sent && (l.note || "") === note && l.price === it.price);
    if (ex) Store.putLine(L.current, {...ex, qty: ex.qty + qty});
    else Store.putLine(L.current, {uid: uid(), id: it.id, name: it.name, price: it.price, qty, note, sent: 0, at: Date.now()});
    if (typeof it.id === "number") { L.usage[it.id] = (L.usage[it.id] || 0) + qty; saveL(); }
    renderPad();
    toast(`${qty} × ${it.name} eklendi`);
  }
  function submitInput() {
    const raw = qEl.value.trim(); if (!raw) return;
    const custom = raw.match(/^(?:(\d{1,2})\s+)?(.+?)\s*=\s*(\d+(?:[.,]\d+)?)\s*(?:\/(.*))?$/);
    if (custom) {
      addItem({id: "c:" + norm(custom[2]), name: custom[2].trim(), price: parseFloat(custom[3].replace(",", "."))}, +(custom[1] || 1), custom[4]);
      resetSearch(); return;
    }
    const {qty, note} = parseInput(raw);
    if (results[active]) { addItem(results[active], qty, note); resetSearch(); }
  }
  function resetSearch() { qEl.value = ""; active = 0; catFilter = null; renderCats(); renderResults(); qEl.focus(); }

  qEl.addEventListener("input", () => { active = 0; if (qEl.value) { catFilter = null; renderCats(); } renderResults(); });
  qEl.addEventListener("focus", renderResults);
  qEl.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { active = Math.min(active + 1, results.length - 1); renderResults(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { active = Math.max(active - 1, 0); renderResults(); e.preventDefault(); }
    else if (e.key === "Enter") { submitInput(); e.preventDefault(); }
    else if (e.key === "Escape") { resetSearch(); qEl.blur(); }
  });
  resEl.addEventListener("pointerdown", e => e.preventDefault());
  resEl.addEventListener("click", e => {
    const b = e.target.closest(".res"); if (!b) return;
    if (e.target.closest("[data-info]")) { infoOpen = infoOpen === +b.dataset.id ? null : +b.dataset.id; const st = resEl.scrollTop; renderResults(); resEl.scrollTop = st; return; }
    const {qty, note, term} = parseInput(qEl.value);
    addItem(ITEMS[+b.dataset.id], qty, note);
    if (catFilter && !term) { qEl.value = ""; renderResults(); } else resetSearch();
  });
  $("#clearQ").onclick = resetSearch;
  document.addEventListener("click", e => { if (e.target.isConnected && !e.target.closest(".search-wrap") && !e.target.closest(".results") && !e.target.closest(".cats") && !e.target.closest(".groups")) resEl.classList.remove("show"); });

  function renderCats() {
    document.querySelectorAll(".gbtn").forEach(b => b.classList.toggle("on", b.dataset.g === group));
    $("#cats").innerHTML = (group ? GROUP_CATS[group] : []).map(c => `<button class="cat${c === catFilter ? " on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  }
  $("#groups").addEventListener("click", e => {
    const b = e.target.closest(".gbtn"); if (!b) return;
    group = group === b.dataset.g ? null : b.dataset.g;
    catFilter = null; qEl.value = ""; active = 0; renderCats(); renderResults();
  });
  $("#cats").addEventListener("click", e => {
    const b = e.target.closest(".cat"); if (!b) return;
    catFilter = catFilter === b.dataset.c ? null : b.dataset.c;
    qEl.value = ""; active = 0; renderCats(); renderResults();
  });

  // ---------- Not defteri
  function renderPad() {
    const t = tableOf(L.current), pad = $("#pad");
    $("#tableName").textContent = L.current ? L.current.replace(/^Masa /, "Masa ") : "Masa seç";
    const lines = activeLines(t);
    if (!L.current) {
      pad.innerHTML = `<div class="pad-empty"><div class="big">Masa seçilmedi</div>Sağ üstten bir masa seç, sonra ürün yazmaya başla.<div style="margin-top:14px"><button class="btn primary" id="pickT">🍽 Masa seç</button></div></div>`;
      $("#pickT").onclick = openTables;
    } else {
      const noteFocused = document.activeElement && document.activeElement.id === "tNote";
      if (noteFocused) { // yazarken notu ezme; sadece listeyi güncelle
        const ul = pad.querySelector(".lines-wrap"); if (ul) ul.innerHTML = linesHTML(lines);
        const tt = pad.querySelector(".pad-total"); if (tt) tt.innerHTML = `<span>Toplam · ${count(t)} ürün</span><span>${TL(total(t))}</span>`;
      } else {
        pad.innerHTML = `
          <div class="pad-head"><div class="pad-title">${esc(L.current)}</div>
            <div class="pad-meta">${t ? "Açılış " + hm(t.opened) : "Yeni masa"}</div></div>
          <div class="lines-wrap">${linesHTML(lines)}</div>
          <div class="pad-foot">
            <input class="table-note" id="tNote" placeholder="✎ Masa notu (kişi sayısı, alerji…)" value="${esc(t?.note || "")}">
            <div class="row total pad-total"><span>Toplam · ${count(t)} ürün</span><span>${TL(total(t))}</span></div>
          </div>`;
        $("#tNote").oninput = e => { if (!readOnly) Store.setNote(L.current, e.target.value); };
      }
    }
    const unsent = lines.filter(l => !l.sent).reduce((a, l) => a + l.qty, 0);
    $("#barTotal").textContent = TL(total(t));
    $("#barInfo").textContent = L.current ? `${L.current} · ${count(t)} ürün` : "Toplam";
    $("#sendBtn").textContent = unsent ? `🔔 Mutfak (${unsent})` : "🔔 Mutfak";
    $("#sendBtn").disabled = !unsent;
    $("#payBtn").disabled = !lines.length;
  }
  function linesHTML(lines) {
    if (!lines.length) return `<div class="pad-empty"><div class="big">Adisyon boş</div>Yukarıya ürün adını yaz. <br><b>2 menemen</b> → 2 adet · <b>sezar / sossuz</b> → notlu · <b>Pasta = 500</b> → menü dışı ürün</div>`;
    return `<ul class="lines">${lines.map(l => `
      <li class="ln${l.sent ? "" : " new"}" data-uid="${esc(l.uid)}">
        <span class="q">${l.qty}</span>
        <button class="body" data-edit>
          <div class="nm">${esc(l.name)}</div>
          ${l.note ? `<div class="note">↳ ${esc(l.note)}</div>` : ""}
          <div class="st${l.sent ? " sent" : ""}">${l.sent ? "✓ mutfağa gitti " + hm(l.sent) : "● yeni"} · ${l.price ? TL(l.price) : "ikram"}</div>
        </button>
        <span class="amt">${TL(l.qty * l.price)}</span>
        <span class="stepper"><button data-dec aria-label="Azalt">−</button><button data-inc aria-label="Arttır">+</button></span>
      </li>`).join("")}</ul>`;
  }

  $("#pad").addEventListener("click", async e => {
    const li = e.target.closest(".ln"); if (!li) return;
    const t = tableOf(L.current), l = t && t.lines[li.dataset.uid]; if (!l) return;
    if (readOnly && !e.target.closest("[data-edit]")) { toast("Yazma yetkiniz yok"); return; }
    if (e.target.closest("[data-inc]")) { Store.putLine(L.current, {...l, qty: l.qty + 1}); renderPad(); }
    else if (e.target.closest("[data-dec]")) {
      if (l.qty > 1) Store.putLine(L.current, {...l, qty: l.qty - 1});
      else { if (l.sent && !(await ask("Ürün silinsin mi?", `"${l.name}" mutfağa gitti.`, [["y", "Sil", "btn primary"]]))) return; Store.delLine(L.current, l.uid); }
      renderPad();
    } else if (e.target.closest("[data-edit]")) openLine(l);
  });

  // ---------- Satır düzenleme
  let editing = null, eQty = 1;
  const QUICK = ["az pişmiş", "orta", "iyi pişmiş", "acısız", "soğansız", "sossuz", "sos ayrı", "glutensiz", "buzsuz", "şekersiz", "laktozsuz süt", "önce gelsin", "sonra gelsin", "ikram"];
  function openLine(l) {
    editing = l; eQty = l.qty;
    $("#lsName").textContent = l.name; $("#lsQty").textContent = eQty;
    const it = typeof l.id === "number" ? ITEMS[l.id] : null;
    $("#lsDesc").innerHTML = it && it.desc ? descHTML(it.desc) : ""; $("#lsDesc").style.display = it && it.desc ? "" : "none";
    $("#lsNote").value = l.note || ""; $("#lsPrice").value = l.price;
    $("#lsQuick").innerHTML = QUICK.map(q => `<button>${q}</button>`).join("");
    show("#lineSheet");
  }
  $("#lsMinus").onclick = () => { eQty = Math.max(1, eQty - 1); $("#lsQty").textContent = eQty; };
  $("#lsPlus").onclick = () => { eQty++; $("#lsQty").textContent = eQty; };
  $("#lsQuick").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.textContent === "ikram") { $("#lsPrice").value = 0; return; }
    const n = $("#lsNote"); n.value = n.value ? n.value + ", " + b.textContent : b.textContent;
  };
  $("#lsSave").onclick = () => {
    if (readOnly) { toast("Yazma yetkiniz yok"); return; }
    const note = $("#lsNote").value.trim(), p = parseFloat($("#lsPrice").value);
    const next = {...editing, qty: eQty, note, price: !isNaN(p) && p >= 0 ? p : editing.price};
    if (note !== (editing.note || "") && editing.sent) next.sent = 0; // değişiklik mutfağa tekrar gitsin
    Store.putLine(L.current, next); renderPad(); hide("#lineSheet");
  };
  $("#lsDelete").onclick = () => {
    if (readOnly) { toast("Yazma yetkiniz yok"); return; }
    Store.delLine(L.current, editing.uid); renderPad(); hide("#lineSheet"); toast("Silindi");
  };

  // ---------- Masalar
  function tblBtn(name) {
    const t = TABLES[slug(name)], lines = activeLines(t), open = lines.length;
    const sent = open && lines.every(l => l.sent);
    return `<button class="tbl${sent ? " sent" : open ? " open" : ""}${name === L.current ? " cur" : ""}" data-t="${esc(name)}"><b>${esc(name.replace(/^Masa /, ""))}</b><small>${open ? TL(total(t)) : "boş"}</small></button>`;
  }
  function renderTables() {
    const others = Object.values(TABLES).map(t => t.name).filter(n => n && !FIXED.includes(n));
    if (L.current && !FIXED.includes(L.current) && !others.includes(L.current)) others.push(L.current);
    $("#tableGroups").innerHTML = GROUPS.map(g => `<div class="grp"><div class="grp-t">${g.title}</div><div class="grid">${g.tables.map(n => tblBtn("Masa " + n)).join("")}</div></div>`).join("")
      + (others.length ? `<div class="grp"><div class="grp-t">Diğer</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">${others.map(tblBtn).join("")}</div></div>` : "");
  }
  function openTables() { renderTables(); show("#tablesSheet"); }
  $("#tableBtn").onclick = openTables;
  $("#tableGroups").onclick = e => { const b = e.target.closest(".tbl"); if (b) selectTable(b.dataset.t); };
  function selectTable(n) {
    if (L.current && L.current !== n) Store.dropEmpty(L.current);
    L.current = n; saveL(); renderPad(); hide("#tablesSheet"); qEl.focus();
  }
  $("#addTable").onclick = () => {
    const n = $("#newTable").value.trim(); if (!n) return;
    $("#newTable").value = ""; selectTable(n);
  };

  // ---------- Mutfağa gönder
  $("#sendBtn").onclick = () => {
    if (readOnly) { toast("Yazma yetkiniz yok"); return; }
    const t = tableOf(L.current); if (!t) return;
    const list = activeLines(t).filter(l => !l.sent); if (!list.length) return;
    Store.markSent(L.current, list.map(l => l.uid), Date.now());
    renderPad(); kitchenTicket(list);
    toast(`${list.length} kalem mutfağa gönderildi`);
  };

  // ---------- Hesap
  let disc = 0, split = 1, method = "Kart";
  function payCalc() {
    const sub = total(tableOf(L.current)), tot = Math.round(sub * (100 - disc)) / 100;
        $("#payTotal").textContent = TL(tot) + (disc ? ` (−%${disc})` : "");
    $("#perPerson").textContent = TL(Math.ceil(tot / split * 100) / 100);
    return {sub, tot};
  }
  $("#payBtn").onclick = () => {
    disc = 0; split = 1; method = "Kart";
    $("#payTable").textContent = L.current;
    $("#splitSeg").innerHTML = [1, 2, 3, 4, 5, 6, 8].map(n => `<button data-s="${n}" class="${n === 1 ? "on" : ""}">${n}</button>`).join("");
    [...$("#methodSeg").children].forEach(b => b.classList.toggle("on", b.dataset.m === "Kart"));
    payCalc(); show("#paySheet");
  };
  const segPick = (sel, attr, fn) => $(sel).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    [...$(sel).children].forEach(x => x.classList.toggle("on", x === b)); fn(b.dataset[attr]); payCalc();
  });
  segPick("#splitSeg", "s", v => split = +v);
  segPick("#methodSeg", "m", v => method = v);
  $("#payTipBtn").onclick = () => { hide("#paySheet"); openTip(); };
  $("#closeBtn").onclick = async () => {
    if (readOnly) { toast("Yazma yetkiniz yok"); return; }
    const t = tableOf(L.current), lines = activeLines(t), {sub, tot} = payCalc();
    if (lines.some(l => !l.sent) && !(await ask("Hesap kapatılsın mı?", "Mutfağa gönderilmemiş ürünler var.", [["y", "Yine de kapat"]]))) return;
    const id = "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    Store.closeTable(L.current, {id, table: L.current, lines: lines.map(({uid, name, price, qty, note}) => ({uid, name, price, qty, note})), sub, total: tot, disc, method, at: Date.now(), day: dayKey(), opened: t.opened});
    L.current = null; saveL();
    hide("#paySheet"); renderPad(); toast("Hesap kapatıldı ✓ " + TL(tot)); openTables();
  };

  // ---------- Yazdırma
  function kitchenTicket(lines) {
    const t = tableOf(L.current);
    $("#print").innerHTML = `<h1>MUTFAK</h1><div class="c"><b>${esc(L.current)}</b> · ${hm(Date.now())}</div><hr>
      <table style="font-size:14px">${lines.map(l => `<tr><td>${l.qty} x ${esc(l.name)}${l.note ? `<br>&nbsp;&nbsp;* ${esc(l.note)}` : ""}</td></tr>`).join("")}</table>${t?.note ? `<hr>Not: ${esc(t.note)}` : ""}`;
  }

  // ---------- TIP
  const ibanClean = s => (s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const ibanFmt = s => ibanClean(s).replace(/(.{4})/g, "$1 ").trim();
  function ibanValid(s) {
    const v = ibanClean(s);
    if (!/^TR\d{24}$/.test(v)) return false;
    const r = (v.slice(4) + v.slice(0, 4)).replace(/[A-Z]/g, c => c.charCodeAt(0) - 55);
    let m = 0; for (const ch of r) m = (m * 10 + +ch) % 97;
    return m === 1;
  }
  function renderTip() {
    const v = $("#tipView"), iban = ibanClean(TIP.iban);
    $("#tipEditBtn").style.display = canEdit && !readOnly ? "" : "none";
    $("#tipCopy").style.display = iban ? "" : "none";
    if (!iban) {
      v.innerHTML = `<div class="tip-title">TIP</div><p class="tip-empty">Henüz bahşiş IBAN'ı girilmedi.${canEdit ? " Aşağıdan <b>IBAN ayarla</b>'ya dokunun." : " Lütfen yöneticiye bildirin."}</p>`;
      return;
    }
    v.innerHTML = `
      <div class="tip-brand"><b>lou</b>maidan</div>
      <div class="tip-title">Teşekkür ederiz</div>
      <p class="tip-sub">${esc(TIP.msg || "Hizmetimizden memnun kaldıysanız QR'ı okutup dilediğiniz tutarda bahşiş gönderebilirsiniz.")}</p>
      <div class="qr-card" id="qrBox"></div>
      <div class="holder">${esc(TIP.name || "")}</div>
      <div class="iban">${esc(ibanFmt(iban))}</div>
      <p class="tip-sub" style="font-size:12px">Banka uygulamanızda QR / IBAN'a para gönder ile okutun, tutarı siz belirleyin</p>`;
    const box = $("#qrBox");
    if (window.QRCode) new QRCode(box, {text: iban, width: 512, height: 512, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M});
    else box.innerHTML = `<div style="line-height:1.4;color:#333;padding:20px">QR yüklenemedi.<br>IBAN'ı aşağıdan kullanın.</div>`;
  }
  function openTip() { $("#tipEdit").style.display = "none"; $("#tipActions").style.display = ""; $("#tipView").style.display = ""; renderTip(); show("#tipSheet"); }
  $("#tipBtn").onclick = openTip;
  $("#tipEditBtn").onclick = () => {
    $("#tipIban").value = ibanFmt(TIP.iban); $("#tipName").value = TIP.name || ""; $("#tipMsg").value = TIP.msg || ""; $("#tipErr").textContent = "";
    $("#tipView").style.display = "none"; $("#tipActions").style.display = "none"; $("#tipEdit").style.display = "";
  };
  $("#tipCancel").onclick = openTip;
  $("#tipSave").onclick = async () => {
    const iban = ibanClean($("#tipIban").value);
    if (!ibanValid(iban)) { $("#tipErr").textContent = "Geçersiz IBAN. TR ile başlayan 26 karakterlik IBAN girin."; return; }
    try { await Store.setTip({iban, name: $("#tipName").value.trim(), msg: $("#tipMsg").value.trim(), updatedAt: Date.now()}); toast("IBAN kaydedildi"); openTip(); }
    catch (e) { $("#tipErr").textContent = "Kaydedilemedi: IBAN'ı yalnızca sayfa sahibi/editörü değiştirebilir."; }
  };
  $("#tipCopy").onclick = async () => {
    try { await navigator.clipboard.writeText(ibanClean(TIP.iban)); toast("IBAN kopyalandı"); } catch (e) { toast(ibanFmt(TIP.iban)); }
  };

  // ---------- Gün sonu
  function renderMore() {
    const h = HISTORY.filter(x => x.day === dayKey());
    const by = m => h.filter(x => x.method === m).reduce((a, x) => a + x.total, 0);
    $("#dayCount").textContent = h.length;
    $("#dayCash").textContent = TL(by("Nakit")); $("#dayCard").textContent = TL(by("Kart")); $("#dayMix").textContent = TL(by("Karışık"));
    $("#dayTotal").textContent = TL(h.reduce((a, x) => a + x.total, 0));
    $("#histList").innerHTML = h.length ? h.map(x => `<li><span>${esc(x.table)}<br><small>${hm(x.at)} · ${esc(x.method)}${x.disc ? " · %" + x.disc : ""} · ${x.lines.reduce((a, l) => a + l.qty, 0)} ürün</small></span><b>${TL(x.total)}</b></li>`).join("") : `<li><small>Bugün kapanan hesap yok.</small></li>`;
    $("#menuDate").textContent = window.MENU_DATE;
  }
  $("#moreBtn").onclick = () => { renderMore(); show("#moreSheet"); };
  $("#resetDay").onclick = async () => {
    const v = await ask("Günü sıfırla", "Test verilerini temizler. Bu işlem geri alınamaz.", [["h", "Sadece kapanan hesaplar", "btn"], ["all", "Her şey (açık masalar dahil)", "btn primary"]]);
    if (!v) return;
    await Store.resetDay(v === "all");
    if (v === "all") { L.current = null; saveL(); renderPad(); }
    renderMore(); toast(v === "all" ? "Tüm masalar ve hesaplar sıfırlandı" : "Kapanan hesaplar sıfırlandı");
  };

  // ---------- Tüm menü
  function renderBrowse() {
    $("#browseList").innerHTML = [["Yiyecekler", GROUP_CATS.food], ["İçecekler", GROUP_CATS.drink]].map(([gt, cs]) => `<h2 style="margin:18px 0 0">${gt}</h2>` + cs.map(c => `<ul class="menu-list"><h3>${esc(c)}</h3>${ITEMS.filter(i => i.cat === c).map(it => `<button class="res" data-id="${it.id}"><span class="n"><div>${esc(it.name)}</div>${descBlock(it)}</span>${infoBtn(it)}<span class="p">${TL(it.price)}</span><span class="plus">+</span></button>`).join("")}</ul>`).join("")).join("");
  }
  $("#browseBtn").onclick = () => { infoOpen = null; renderBrowse(); hide("#moreSheet"); show("#browseSheet"); };
  $("#browseList").onclick = e => {
    const b = e.target.closest(".res"); if (!b) return;
    if (e.target.closest("[data-info]")) { infoOpen = infoOpen === +b.dataset.id ? null : +b.dataset.id; const sh = $("#browseSheet .sheet"), st = sh.scrollTop; renderBrowse(); sh.scrollTop = st; return; }
    addItem(ITEMS[+b.dataset.id], 1, "");
  };

  // ---------- Yardımcılar
  // Sayfa içi onay penceresi (gömülü sayfalarda confirm() engellenebiliyor)
  function ask(title, text, buttons) {
    return new Promise(res => {
      $("#askTitle").textContent = title; $("#askText").textContent = text || "";
      $("#askBtns").innerHTML = [["", "Vazgeç", "btn"], ...buttons].map(([v, label, cls]) => `<button class="${cls || "btn primary"}" data-v="${esc(v)}">${esc(label)}</button>`).join("");
      const sc = $("#askSheet");
      const done = v => { sc.classList.remove("show"); sc.onclick = null; res(v); };
      sc.onclick = e => { if (e.target === sc) return done(""); const b = e.target.closest("[data-v]"); if (b) done(b.dataset.v); };
      show("#askSheet");
    });
  }
  function show(s) { $(s).classList.add("show"); }
  function hide(s) { $(s).classList.remove("show"); }
  document.querySelectorAll(".scrim").forEach(sc => sc.addEventListener("click", e => {
    if (e.target === sc || e.target.closest("[data-close]")) sc.classList.remove("show");
  }));
  let tt;
  function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 1700); }

  renderCats(); renderPad();
  if (!L.current) openTables();
  connect();
})();
</script>
</body>
</html>
